# 打 v* 标签或手动触发：多平台打包并上传到 GitHub Release，同时生成 latest.json 供应用内更新
# 说明：updater 公钥见 src-tauri/tauri.conf.json plugins.updater.pubkey；
# 首次发布前：pnpm tauri signer generate -w ~/.tauri/omp-mini.key，把公钥填入配置，
# 私钥全文写入仓库 Secrets TAURI_SIGNING_PRIVATE_KEY（密码为空则 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 置空）

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发版前守卫：签名没配好、版本号与 tag 不一致时直接失败，别产出一个"装不上更新"的 release。
  guard:
    name: Guard (签名 / 版本一致性)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: updater pubkey 必须已配置
        run: |
          if grep -q 'TODO' src-tauri/tauri.conf.json; then
            echo "::error::tauri.conf.json 的 plugins.updater.pubkey 仍是 TODO 占位。先执行 pnpm tauri signer generate -w ~/.tauri/omp-mini.key，把公钥填进配置、私钥全文写进仓库 Secrets TAURI_SIGNING_PRIVATE_KEY（见 README「应用内更新」）。"
            exit 1
          fi

      - name: tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致；发版前先升版本号并同步 CHANGELOG。"
            exit 1
          fi

  publish:
    needs: guard
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: ""
          - name: macOS Intel
            platform: macos-15-intel
            args: ""
          - name: Linux x64
            platform: ubuntu-24.04
            args: ""
          - name: Windows x64
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload to Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ompMiniDesktop v__VERSION__
          releaseBody: |
            见 CHANGELOG.md。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
