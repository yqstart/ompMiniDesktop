name: 功能建议
description: 提出新功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        V1 明确不做：自动化/定时任务、插件/Skill/MCP/Hook 管理、主题市场、
        云同步、多窗口协作、终端 PTY 仿真、diff 合并编辑器、用量统计。
        这些建议会直接归档到 V2 讨论。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 场景
      description: 你在什么情况下需要这个能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以只描述目标交互，不一定要有实现细节
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选替代方案
      description: 你考虑过的其他做法（可选）
  - type: dropdown
    id: priority
    attributes:
      label: 对你的重要程度
      options:
        - 阻塞日常使用
        - 明显提升效率
        - 锦上添花
